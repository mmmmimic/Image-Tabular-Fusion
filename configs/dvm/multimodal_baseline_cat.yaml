train:
  batch_size: 32
  num_epochs: 200
  lr: 0.0001
  weight_decay: 0.00001
  warmup_steps: 1000 # 0 if activating reduceonplateau
  optimizer_type: adamw # (sgd, adam, adamw)
  resampling: False # True if sample number is considerably imbalanced among categories 
  device: cuda # (cuda, cpu)
  accum_step: 1 # >1 means gradient accumulation over iterations
  mode: accum # (accum, avg), if the dataset is too large, set to avg to run AverageMeter over batches
  metric_names: ['acc', 'avg_acc'] # ('acc', 'avg_acc', 'auc', 'acc@3', 'acc@5')
  criterion: # specify cost function
    cse: 
      weight: 1
      config: {}
  monitor_metric: acc
  seed: 2023 # -1 for not fixing random seed
   
data:
  dataset: dvm
  config:
    numerical: True
    cache_images: False 
    tab_embedder:
      name: onehot
      config: {} 
    transforms:
      tabular:
        name: identity
        config: {}
      image:
        train_shape: [128, 128]
        test_shape: [128, 128]
        norm: True
        aug_rate: 0.95
        train_augs: "T.Compose([ \
        T.RandomResizedCrop(size=(128, 128), scale=(0.08, 1.0), ratio=(0.75, 1.3333)), \
        T.RandomHorizontalFlip(p=0.5), \
        T.RandomApply([T.ColorJitter(brightness=[0.2, 1.8], contrast=[0.2, 1.8], saturation=[0.2, 1.8], hue=0)], p=0.8), \ 
        T.RandomGrayscale(p=0.2), \ 
        T.RandomApply([T.GaussianBlur(kernel_size=(29, 29), sigma=(0.1, 2.0))], p=0.5) \ 
        ])"
        test_augs: ""

model:
  name: mm_baseline
  wrapper:
    wrapper_input: dict # (tuple) | (dict)
    model_input: dict # (tensor) | (dict)
    model_output: tensor # (tensor) | (dict)
    kwd:  # only applicable when dataloader item is of type (dict), but model input is of type (tensor)
  config:
    num_classes: 286
    tab_emb_dim: 63
    emb_dim: 1024
    fusion: cat
    image_encoder: rn50
    tab_encoder: mlp


    
