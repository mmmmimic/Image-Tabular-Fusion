train:
  batch_size: 16
  num_epochs: 20
  lr: 0.001
  weight_decay: 0.00001
  warmup_steps: 10 # 0 if activating reduceonplateau
  optimizer_type: adamw # (sgd, adam, adamw)
  resampling: True # True if sample number is considerably imbalanced among categories 
  device: cuda # (cuda, cpu)
  accum_step: 1 # >1 means gradient accumulation over iterations
  mode: accum # (accum, avg), if the dataset is too large, set to avg to run AverageMeter over batches
  metric_names: ['acc', 'avg_acc'] # ('acc', 'avg_acc', 'auc', 'acc@3', 'acc@5')
  criterion: # specify cost function
    cse: 
      weight: 1
      config: {}
  monitor_metric: acc
  seed: 2023 # -1 for not fixing random seed
   
data:
  dataset: isup
  config:
    numerical: False
    preload_images: False 
    tab_embedder:
      name: default
      config: {} 
    transforms:
      tabular:
        name: identity
        config: {}
      image:
        train_shape: [224, 224]
        test_shape: [224, 224]
        norm: True
        aug_rate: 0.95
        train_augs: "T.Compose([ \
        T.RandomHorizontalFlip(p=0.5), \
        T.RandomGrayscale(p=0.2), \ 
        T.RandomApply([T.GaussianBlur(kernel_size=(29, 29), sigma=(0.1, 2.0))], p=0.5)
        ])"
        test_augs: ""
    modal: ['img']

model:
  name: resnet50
  wrapper:
    wrapper_input: dict # (tuple) | (dict)
    model_input: tensor # (tensor) | (dict)
    model_output: tensor # (tensor) | (dict)
    kwd: 'image' # only applicable when dataloader item is of type (dict), but model input is of type (tensor)
  config:
    num_classes: 3

    